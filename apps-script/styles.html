<style>
/* ============================================================= foundations */
:root{
  --bg:#eef1f6;
  --surface:#ffffff;
  --surface-2:#f6f8fb;
  --line:#dde3ec;
  --line-strong:#c3ccda;
  --text:#0f172a;
  --muted:#64748b;
  --brand:#2563eb;
  --brand-dark:#1d4ed8;
  --brand-soft:#e8efff;
  --done:#16a34a;
  --done-dark:#15803d;
  --danger:#dc2626;
  --amber:#b45309;
  --r-sm:8px;
  --r:12px;
  --r-lg:18px;
  --shadow-1:0 1px 2px rgba(15,23,42,.06);
  --shadow-2:0 2px 4px rgba(15,23,42,.06), 0 8px 20px rgba(15,23,42,.08);
  --shadow-3:0 12px 40px rgba(15,23,42,.18);
  --tap:.14s cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box}

html,body{height:100%}

body{
  margin:0;
  font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",
              "Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--text);
  background:var(--bg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

body.booting{opacity:0}

button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px;line-height:1.55}
code{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;font-size:12px;
}

/* ------------------------------------------------------ loading indicator */
#netbar{
  position:fixed;top:0;left:0;height:2px;width:100%;
  background:linear-gradient(90deg,transparent,var(--brand),transparent);
  background-size:40% 100%;background-repeat:no-repeat;
  opacity:0;transition:opacity .2s;z-index:200;pointer-events:none;
}
body.busy #netbar{opacity:1;animation:slide 1s linear infinite}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}

/* ================================================================= app bar */
.appbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:18px;
  padding:10px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-1);
  z-index:20;
}

.bar-side{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.bar-side.end{justify-content:flex-end;flex:0 0 auto}

.brand{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:600;letter-spacing:-.01em;
  padding-right:6px;white-space:nowrap;
}
.brand b{font-weight:800}
.brand-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);
}

.field{position:relative;display:block;min-width:0}
.field.grow{flex:1;max-width:280px}
.field-label{
  position:absolute;top:-1px;left:11px;
  font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);pointer-events:none;
}
.field select{
  appearance:none;-webkit-appearance:none;
  width:100%;min-width:96px;
  padding:15px 30px 6px 10px;
  background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:14px;font-weight:600;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 60%,calc(100% - 10px) 60%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  text-overflow:ellipsis;
}
.field select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

.icon-btn{
  width:34px;height:34px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:var(--r-sm);
  background:var(--brand-soft);color:var(--brand-dark);
  font-size:19px;font-weight:600;line-height:1;
  transition:background var(--tap),transform var(--tap);
}
.icon-btn:hover{background:#d8e5ff}
.icon-btn:active{transform:scale(.94)}
.icon-btn.ghost{background:none;color:var(--muted);font-size:22px}
.icon-btn.ghost:hover{background:var(--surface-2);color:var(--text)}

/* progress meter */
.bar-mid{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.meter{
  width:120px;height:7px;border-radius:99px;
  background:var(--line);overflow:hidden;
}
.meter-fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--done),#22c55e);
  transition:width .35s cubic-bezier(.2,.7,.3,1);
}
.meter-text{font-size:12.5px;color:var(--muted);white-space:nowrap}
.meter-text b{color:var(--text);font-size:15px;font-weight:700;margin-right:3px}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 13px;
  border:1px solid var(--line);border-radius:99px;
  background:var(--surface);
  font-size:13px;font-weight:600;white-space:nowrap;
  transition:background var(--tap),border-color var(--tap),transform var(--tap);
}
.chip:hover{background:var(--surface-2);border-color:var(--line-strong)}
.chip:active{transform:scale(.97)}
.chip.solid{background:var(--text);border-color:var(--text);color:#fff}
.chip.solid:hover{background:#1e293b}
.chip .gl{font-size:14px;line-height:1}

/* ================================================================ toolbar */
.toolbar{
  flex:0 0 auto;
  padding:0 16px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  z-index:15;
}
.tools{display:none;align-items:center;gap:8px;height:46px}
.tool-group{display:flex;align-items:center;gap:6px}
body:not(.edit-mode):not(.view-mode) .tools.normal{display:flex}
body.edit-mode .tools.edit{display:flex}

.tool{
  height:32px;padding:0 12px;
  border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);
  font-size:13px;font-weight:600;white-space:nowrap;
  transition:background var(--tap),border-color var(--tap),color var(--tap),transform var(--tap);
}
.tool:hover{background:var(--surface-2);border-color:var(--line-strong)}
.tool:active{transform:scale(.97)}
.tool:disabled{opacity:.45;cursor:default;transform:none}
.tool.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.tool.primary:hover{background:var(--brand-dark)}
.tool.on{background:var(--brand-soft);border-color:#bcd2ff;color:var(--brand-dark)}
.tool.quiet-danger{color:var(--danger)}
.tool.quiet-danger:hover{background:#fef2f2;border-color:#fecaca}
.hint{font-size:12.5px;color:var(--muted);margin-right:4px}

/* ============================================================== workspace */
.workspace{flex:1;display:flex;min-height:0}

.stage{
  flex:1;min-width:0;
  display:flex;flex-direction:column-reverse;   /* teacher view: screen at foot */
  gap:10px;padding:14px 16px 16px;
}
body.orient-student .stage{flex-direction:column}  /* student view: screen on top */

.screen{
  flex:0 0 auto;
  display:grid;place-items:center;
  height:26px;border-radius:99px;
  background:linear-gradient(180deg,#475569,#334155);
  color:#e2e8f0;
  font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  box-shadow:var(--shadow-1);
}

.gridwrap{flex:1;min-height:0;overflow:auto}

#grid{
  display:grid;
  gap:10px;
  min-height:100%;
}

/* ------------------------------------------------------------------ seats */
.seat{position:relative;border-radius:var(--r);min-width:0}

body.edit-mode .seat{
  border:2px dashed transparent;
  border-radius:var(--r-lg);
  transition:background var(--tap),border-color var(--tap);
}
body.edit-mode .seat.empty{background:rgba(15,23,42,.035);border-color:var(--line-strong)}
body.edit-mode .seat.over{background:var(--brand-soft);border-color:var(--brand)}
/* Occupied seats already show their own position as the tile's big number -
   this corner label is only needed to identify an empty desk. */
body.edit-mode .seat.empty::after{
  content:attr(data-idx);
  position:absolute;top:4px;left:7px;
  font-size:9.5px;font-weight:700;color:#94a3b8;
  pointer-events:none;z-index:6;
}

/* ------------------------------------------------------------------ tiles */
.tile{
  position:relative;
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px 8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow-1);
  overflow:hidden;
  transition:transform var(--tap),background .18s,border-color .18s,box-shadow var(--tap);
}
body:not(.view-mode):not(.edit-mode) .tile:hover{
  transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--line-strong);
}
body:not(.view-mode):not(.edit-mode) .tile:active{transform:scale(.96)}
.tile:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.t-num{
  font-size:clamp(19px,5.4vh,42px);
  font-weight:800;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.t-name{
  display:none;
  max-width:100%;
  font-size:clamp(10px,1.7vh,13px);font-weight:600;line-height:1.15;
  text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted);
}
.t-time{
  height:0;overflow:hidden;
  font-size:clamp(10px,1.9vh,15px);font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  opacity:0;transition:opacity .2s;
}

body.show-names .t-name{display:block}
body.show-names .t-num{font-size:clamp(17px,4.3vh,34px)}

/* done state */
.tile.done{
  background:linear-gradient(180deg,var(--done),var(--done-dark));
  border-color:var(--done-dark);
  color:#fff;
  box-shadow:0 1px 2px rgba(21,128,61,.35), 0 4px 12px rgba(21,128,61,.22);
}
.tile.done .t-name{color:rgba(255,255,255,.85)}
.tile.done .t-time{
  height:auto;opacity:1;margin-top:3px;
  padding:1px 8px;border-radius:99px;
  background:rgba(255,255,255,.2);color:#fff;
}
.tile.done::after{
  content:"";
  position:absolute;top:7px;right:8px;
  width:9px;height:5px;
  border-left:2.5px solid rgba(255,255,255,.9);
  border-bottom:2.5px solid rgba(255,255,255,.9);
  transform:rotate(-45deg);
}
.tile.just::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:#fff;opacity:.55;animation:flash .45s ease-out forwards;
}
@keyframes flash{to{opacity:0}}

.tile.saving{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.72}}

/* edit-mode tiles */
body.edit-mode .tile{cursor:grab;box-shadow:none}
body.edit-mode .tile:hover{border-color:var(--brand);box-shadow:var(--shadow-2)}
body.edit-mode .tile.done{background:var(--surface);border-color:var(--line);color:var(--text)}
body.edit-mode .tile.done .t-name{color:var(--muted)}
body.edit-mode .tile.done::after{display:none}
body.edit-mode .t-time{display:none}
.tile.ghost{opacity:.32}
.tile.picked{
  border-color:var(--brand);border-width:2px;
  box-shadow:0 0 0 4px var(--brand-soft);
  transform:scale(1.03);
}

body.view-mode .tile{pointer-events:none}

/* ---------------------------------------------------------- reserve panel */
#reserve{
  display:none;
  flex:0 0 190px;
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:12px;
  overflow-y:auto;
}
body.edit-mode #reserve{display:block}
#reserve.over{background:var(--brand-soft)}

.reserve-head{
  display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
}
.pill-count{
  padding:1px 7px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:11px;letter-spacing:0;color:var(--text);
}
.reserve-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));
  gap:8px;align-content:start;
}
.reserve-list .seat{height:62px}
.reserve-note{font-size:11.5px;line-height:1.5;color:var(--muted);margin:14px 2px 0}
.reserve-empty{
  grid-column:1/-1;padding:16px 6px;text-align:center;
  font-size:12px;color:var(--muted);
}

/* ================================================================= modals */
.backdrop{
  position:fixed;inset:0;z-index:100;
  display:grid;place-items:center;
  padding:20px;
  background:rgba(15,23,42,.5);
  backdrop-filter:blur(2px);
  animation:fade .16s ease-out;
}
/* `display:grid` above and the `[hidden]` UA rule tie on specificity, and
   this author rule would otherwise win the tie - so an unopened modal still
   rendered full-screen and swallowed clicks meant for whatever was under it. */
.backdrop[hidden]{display:none}
@keyframes fade{from{opacity:0}}

.modal{
  width:100%;max-width:420px;max-height:86vh;
  display:flex;flex-direction:column;
  background:var(--surface);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);
  animation:rise .18s cubic-bezier(.2,.7,.3,1);
}
.modal.wide{max-width:760px}
@keyframes rise{from{transform:translateY(10px);opacity:0}}

.modal-head{
  display:flex;align-items:center;gap:10px;
  padding:16px 14px 12px 20px;
}
.modal-head h2{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-body{padding:0 20px 4px;overflow-y:auto;flex:1}
.modal-foot{
  display:flex;align-items:center;gap:8px;
  padding:14px 20px 18px;
}

.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line)}
.tab{
  padding:8px 12px 9px;
  font-size:13px;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--text)}
.tab.is-on{color:var(--brand-dark);border-bottom-color:var(--brand)}
.modal-body section{padding-top:14px}

.text-input,.import-box{
  width:100%;padding:9px 11px;
  background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:14px;
}
.text-input:focus,.import-box:focus{
  outline:none;border-color:var(--brand);background:var(--surface);
  box-shadow:0 0 0 3px var(--brand-soft);
}
.import-box{min-height:170px;resize:vertical;font-size:13px;line-height:1.5}
.import-foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.preview{
  margin-top:12px;padding:10px 12px;max-height:190px;overflow:auto;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:12.5px;line-height:1.7;
}
.preview b{display:inline-block;min-width:26px;color:var(--muted);font-weight:700}

/* roster rows */
.roster-head,.rrow{
  display:grid;grid-template-columns:16px 30px 1.1fr 1.1fr 1.1fr 52px;
  align-items:center;gap:8px;
}
.roster-head{
  padding:0 8px 6px 4px;margin-top:12px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);
}
.roster-head span:nth-child(3),.roster-head span:nth-child(4),.roster-head span:nth-child(5){
  text-transform:none;letter-spacing:0;
}
.roster{display:flex;flex-direction:column;gap:5px;padding-top:8px}
.rrow{
  padding:5px 8px 5px 4px;
  border:1px solid transparent;border-radius:var(--r-sm);
  background:var(--surface-2);
}
.rrow.over{border-color:var(--brand);background:var(--brand-soft)}
.rrow.ghost{opacity:.35}
.rgrip{cursor:grab;color:var(--line-strong);font-size:13px;padding:0 2px;letter-spacing:-2px}
.rno{
  text-align:center;
  font-size:13px;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.rname,.rsex{
  min-width:0;padding:6px 9px;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;
  font-size:13.5px;
}
.rsex{padding:6px 4px;text-align:center;cursor:pointer}
.rname:focus,.rsex:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* ================================================================= toasts */
.toasts{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;
}
.toast{
  padding:9px 16px;border-radius:99px;
  background:var(--text);color:#fff;
  font-size:13px;font-weight:600;
  box-shadow:var(--shadow-2);
  animation:pop .2s cubic-bezier(.2,.7,.3,1);
}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--done-dark)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}

/* ============================================================ view mode */
body.view-mode .toolbar{display:none}
body.view-mode .stage{padding:18px 22px 22px}
body.view-mode .screen{height:32px;font-size:11px}
body.view-mode #grid{gap:12px}
body.view-mode .t-num{font-size:clamp(22px,6.6vh,58px)}
body.view-mode .t-time{font-size:clamp(11px,2.2vh,18px)}

/* =========================================================== small screens */
@media (max-width:900px){
  .bar-mid{display:none}
  .brand{display:none}
  .field.grow{max-width:none}
}
@media (max-width:640px){
  .appbar{padding:8px 10px;gap:8px}
  .toolbar{padding:0 10px}
  .stage{padding:10px}
  #reserve{flex-basis:132px}
}
</style>
